# Project-local BoT-SORT configuration with native YOLO appearance ReID enabled.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.80
fuse_score: true

# Compensate for motion in the panoramic camera stream.
gmc_method: sparseOptFlow

# Appearance association. "auto" reuses native YOLO11 backbone features.
proximity_thresh: 0.50
appearance_thresh: 0.80
with_reid: true
model: auto
