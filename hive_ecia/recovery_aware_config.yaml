experiment:
  name: hive_v2_osnet_ain_recovery_aware_hr_fusion
  seed: 42

model:
  embedding_dim: 512
  projection_dim: 64
  relation_hidden_dim: 32
  parameter_limit: 50000
  max_competitors: 12

recovery_aware:
  base_checkpoint: outputs/hive_ecia_reid_retrain/20261030_osnet_retrain_v1/osnet_ain_dmc/quadtrack/base_only/training/best.pt
  event_hidden_dim: 32
  hr_distribution_temperature: 0.20

reid:
  encoder: osnet_ain_x1_0
  checkpoint: models/reid_benchmark/osnet_ain_x1_0_d_m_c.pth
  display: OSNet-AIN x1.0 (D+M+C)

data:
  train_cache: outputs/hive_ecia_reid_retrain/20261030_osnet_retrain_v1/osnet_ain_dmc/cache/train.npz
  validation_cache: outputs/hive_ecia_reid_retrain/20261030_osnet_retrain_v1/osnet_ain_dmc/cache/validation.npz
  train_sequences: ['0015', '0018', '0020', '0021', '0022', '0023', '0024', '0026', '0027', '0029']
  validation_sequences: ['0019', '0028']
  calibration_sequences: ['0030']
  test_sequences: ['0016', '0017', '0025', '0031']
  required_sample_kinds: [positive, negative, hard_negative, no_merge]
  sample_weights:
    positive: 1.0
    negative: 1.0
    hard_negative: 2.0
    no_merge: 1.5

training:
  device: auto
  epochs: 50
  patience: 10
  batch_size: 128
  num_workers: 0
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip_norm: 1.0

loss:
  fused_classification_weight: 1.0
  margin_ranking_weight: 0.25
  wrong_merge_weight: 1.0
  base_preservation_weight: 1.0
  recovery_weight: 1.0
  gate_supervision_weight: 0.75
  helpful_gate_weight: 3.0
  harmful_gate_weight: 2.0
  ranking_margin: 0.20

calibration:
  old_probability_grid: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]
  old_margin_grid: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4]
  idsw_reduction_weight: 0.1
  wrong_correction_penalty: 0.5

inference:
  embedding_cache_dir: outputs/hive_ecia_recovery_aware/20261030_osnet_ain_recovery_v1/embedding_cache_overlay
  embedding_cache_fallback_dirs:
    - outputs/hive_ecia_reid_retrain/20261030_osnet_retrain_v1/osnet_ain_dmc/embedding_cache
  max_hr_crops_per_event: 1
  max_segment_gap: 30
  min_old_probability: 0.5
  min_old_margin: 0.1
